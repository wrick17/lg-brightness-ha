name: Regression checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wrick17/ha-webostv-unsigned
          ref: 98bb01ba156fb4d49df4080f2c5d5e788c7b0ace
          path: ha-webostv-unsigned
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: wrick17/ha-webostv-unsigned
          ref: 29dc852bc450c73611b39faa8b74fc2a02eaa5d7
          path: legacy-override
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - run: python -m pip install homeassistant==2026.1.3 aiowebostv==0.9.2 async-upnp-client==0.46.1
      - name: Verify legacy patch provenance
        run: |
          git -C legacy-override apply --check "$GITHUB_WORKSPACE/webostv-ssdp.patch"
          git -C legacy-override apply "$GITHUB_WORKSPACE/webostv-ssdp.patch"
          diff -r legacy-override/custom_components/webostv ha-webostv-unsigned/custom_components/webostv
      - run: python tests/test_configuration.py configuration.example.yaml
      - run: python tests/test_recovery.py automations.yaml
      - run: python tests/test_connection.py ha-webostv-unsigned
      - run: python tests/test_ssdp.py ha-webostv-unsigned
